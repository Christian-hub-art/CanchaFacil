<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${accion}">Calificacion</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header th:replace="~{fragmentos/cabecera :: cabecera}"></header>

<main>
    <h2 th:text="${accion}">Crear calificacion</h2>

    <div class="error" th:if="${error}" th:text="${error}"></div>
    <p class="vacio" th:if="${#lists.isEmpty(reservas)}">Primero cree una reserva.</p>

    <form th:action="@{/calificaciones/add}" th:object="${calificacion}" method="post">
        <input type="hidden" th:field="*{id}">

        <!-- El usuario y el espacio se toman de la reserva, no se piden aparte -->
        <label for="reservaId">Reserva</label>
        <select id="reservaId" name="reservaId" required>
            <option value="">-- Seleccione --</option>
            <option th:each="r : ${reservas}"
                    th:value="${r.id}"
                    th:text="'#' + ${r.id} + ' - ' + ${r.fecha}"
                    th:selected="${calificacion.reserva != null and calificacion.reserva.id == r.id}">#1</option>
        </select>

        <label for="puntuacion">Puntuacion (1 a 5)</label>
        <input type="number" id="puntuacion" th:field="*{puntuacion}" min="1" max="5" required>

        <label for="comentario">Comentario</label>
        <textarea id="comentario" th:field="*{comentario}" rows="3"></textarea>

        <p>
            <button class="boton" type="submit">Guardar</button>
            <a class="boton gris" th:href="@{/calificaciones}">Cancelar</a>
        </p>
    </form>
</main>

</body>
</html>
