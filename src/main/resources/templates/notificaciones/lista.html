<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notificaciones</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header th:replace="~{fragmentos/cabecera :: cabecera}"></header>

<main>
    <h2 th:text="${titulo}">Notificaciones</h2>

    <a class="boton" th:href="@{/notificaciones/add}">Nueva notificacion</a>

    <form th:action="@{/notificaciones}" method="get" style="margin-top:1rem">
        <label for="usuarioId">Filtrar por id de usuario</label>
        <input type="number" id="usuarioId" name="usuarioId" min="1">
        <button class="boton" type="submit" style="margin-top:.6rem">Filtrar</button>
    </form>

    <p class="vacio" th:if="${#lists.isEmpty(notificaciones)}">No hay notificaciones para mostrar.</p>

    <table th:unless="${#lists.isEmpty(notificaciones)}">
        <thead>
        <tr><th>Id</th><th>Usuario</th><th>Tipo</th><th>Mensaje</th><th>Fecha</th><th>Leida</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="notificacion : ${notificaciones}">
            <td th:text="${notificacion.id}">1</td>
            <td th:text="${notificacion.usuario != null} ? ${notificacion.usuario.nombre} : '-'">Juan</td>
            <td th:text="${notificacion.tipo}">RESERVA</td>
            <td th:text="${notificacion.mensaje}">Su reserva fue confirmada</td>
            <td th:text="${notificacion.fecha}">2026-08-24</td>
            <td th:text="${notificacion.leido} ? 'Si' : 'No'">No</td>
            <td class="acciones">
                <a class="boton" th:href="@{/notificaciones/{id}(id=${notificacion.id})}">Ver</a>
                <a class="boton gris" th:href="@{/notificaciones/leer/{id}(id=${notificacion.id})}">Marcar leida</a>
                <a class="boton rojo" th:href="@{/notificaciones/delete/{id}(id=${notificacion.id})}">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
