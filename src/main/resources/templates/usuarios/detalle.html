<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del usuario</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header th:replace="~{fragmentos/cabecera :: cabecera}"></header>

<main class="contenedor-simple">
    <h2>Mi perfil</h2>
    <p style="color:var(--texto-suave); margin-top:-.4rem">Informacion de la cuenta y datos de contacto.</p>

    <div class="perfil">
        <div class="avatar" th:text="${#strings.substring(usuario.nombre,0,1)}">J</div>
        <div class="datos">
            <h2 th:text="${usuario.nombre}">Juan</h2>
            <div class="correo" th:text="${usuario.email}">juan@mail.com</div>
            <span class="insignia-rol" th:text="${usuario.rol}">CLIENTE</span>
        </div>
    </div>

    <div class="panel-info">
        <h3>Informacion personal</h3>
        <dl>
            <dt>Id</dt><dd th:text="${usuario.id}">1</dd>
            <dt>Telefono</dt><dd th:text="${usuario.telefono}">300</dd>
            <dt>Direccion</dt><dd th:text="${usuario.direccion}">Calle 47</dd>
            <dt>Fecha de registro</dt><dd th:text="${usuario.fechaRegistro}">2026-01-01</dd>
        </dl>
    </div>

    <div class="perfil-acciones">
        <a class="boton" th:href="@{/reservas(usuarioId=${usuario.id})}">Ver sus reservas</a>
        <a class="boton" th:href="@{/notificaciones(usuarioId=${usuario.id})}">Ver sus notificaciones</a>
        <a class="boton gris" th:href="@{/usuarios/update/{id}(id=${usuario.id})}">Editar</a>
        <a class="boton gris" th:href="@{/usuarios}">Volver</a>
    </div>
</main>

</body>
</html>
